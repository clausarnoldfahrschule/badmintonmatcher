<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="corkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#022c22" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background: Modern Rounded Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Court Lines Pattern in Background -->
  <path d="M 64 256 L 448 256" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="16 12" />
  <rect x="96" y="96" width="320" height="320" rx="24" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Badminton Shuttlecock (Stylized & High Contrast) -->
  <g filter="url(#shadow)" transform="translate(256, 256) rotate(-35) translate(-256, -256)">
    <!-- Shuttlecock Feathers Flare -->
    <path d="M 180 140 L 332 140 L 290 310 L 222 310 Z" fill="#ffffff" opacity="0.95" />
    
    <!-- Feather Ribs / Texture -->
    <path d="M 196 140 L 230 305" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 226 140 L 244 308" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 256 140 L 256 310" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 286 140 L 268 308" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <path d="M 316 140 L 282 305" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    
    <!-- Feather Bands / Threads -->
    <path d="M 194 200 Q 256 215 318 200" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" />
    <path d="M 208 260 Q 256 272 304 260" fill="none" stroke="#059669" stroke-width="6" stroke-linecap="round" />

    <!-- Cork Base (Bottom Cap) -->
    <path d="M 218 310 C 218 310 216 380 256 380 C 296 380 294 310 294 310 Z" fill="url(#corkGrad)" />
    <!-- Cork Accent Ring -->
    <path d="M 220 316 L 292 316" stroke="#b45309" stroke-width="4" />
  </g>
</svg>
